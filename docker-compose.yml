services:
  mongodb:
    image: mongo:8.2.7@sha256:7abfba0d07c9330373f8173981ea4d09cd8a82cdf0e86ccaf7008848d1d24f62
    container_name: firefly-sms-parser-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGODB_SYSTEM_LOG_VERBOSITY: 0
    restart: always
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      firefly-network:
        aliases:
          # Keep existing config.ini files working after container renames.
          - firefly_parser_bot_mongodb

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firefly-sms-parser-bot
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      # Pass these through when set; otherwise use config.ini values.
      GROQ_API_KEY:
      GROQ_MODEL:
      OPENROUTER_API_KEY:
      OPENROUTER_MODEL:
      AI_MAX_CONCURRENCY:
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./config.ini:/app/config.ini
      - ./workdir:/app/workdir
      - ./logs:/app/logs
      - ./downloads:/app/downloads
    restart: always
    networks:
      - firefly-network
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  firefly-network:
    driver: bridge

volumes:
  mongo-data:
